<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타병원 인프라 비교 v3.16</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --ink-soft:#3A4A63;
    --paper:#F4F6F5; --panel:#FFFFFF;
    --accent:#2A6F6F; --accent-soft:#E4EFEE;
    --brick:#C4432B; --brick-soft:#F6E7E2;
    --gold:#B8863E; --gold-soft:#F3EBDB;
    --line:#DBE1DE; --line-soft:#EAEEEC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Pretendard',-apple-system,sans-serif;
  }
  .app{display:flex;min-height:100vh;}

  /* ---------- 좌측 사이드바 ---------- */
  .sidebar{
    width:280px; flex-shrink:0; background:var(--ink); color:#fff;
    padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar .eyebrow{font-size:11px;letter-spacing:.14em;color:#8FD3C9;font-weight:600;}
  .versionbadge{
    display:inline-block;background:var(--brick);color:#fff;font-size:12px;font-weight:800;
    padding:3px 10px;border-radius:20px;margin:6px 0 4px;letter-spacing:.03em;
  }
  .sidebar h1{font-family:'Noto Serif KR',serif;font-size:19px;margin:4px 0 16px;}
  .sidebar input[type=text]{
    width:100%;border:none;border-radius:8px;padding:9px 11px;font-size:13px;
    font-family:inherit;margin-bottom:10px;background:rgba(255,255,255,.1);color:#fff;
  }
  .sidebar input[type=text]::placeholder{color:rgba(255,255,255,.5);}
  .selrow{display:flex;gap:6px;margin-bottom:12px;}
  .selrow button{
    flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    color:#fff;border-radius:6px;padding:6px;font-size:11px;cursor:pointer;font-family:inherit;
  }
  .region-title{font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.45);font-weight:700;margin:14px 0 4px;text-transform:uppercase;}
  .hitem{
    display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12.5px;cursor:pointer;
    border-radius:6px;
  }
  .hitem:hover{background:rgba(255,255,255,.06);}
  .hitem input{accent-color:#8FD3C9;width:14px;height:14px;flex-shrink:0;}
  .hitem.hidden{display:none;}
  .hitem .mine{color:#F6B375;font-weight:700;}

  .keybox{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);}
  .keybox label{font-size:11px;color:rgba(255,255,255,.6);display:block;margin-bottom:6px;}
  .keybox .krow{display:flex;gap:6px;}
  .keybox input{flex:1;}
  .keybox .clr{background:var(--brick);border:none;color:#fff;border-radius:6px;padding:0 10px;font-size:11px;cursor:pointer;}

  .runbtn{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;
    padding:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:14px;
  }
  .runbtn:disabled{background:rgba(255,255,255,.15);}

  /* ---------- 메인 ---------- */
  .main{flex:1;padding:32px 28px 80px;min-width:0;}
  .main .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .main h2{font-family:'Noto Serif KR',serif;font-size:20px;margin:0;}
  .main .src{font-size:11px;color:var(--ink-soft);}
  .status{font-size:13px;color:var(--ink-soft);margin:10px 0 18px;min-height:18px;}
  .status.error{color:var(--brick);}
  .progress-track{background:var(--line-soft);border-radius:6px;height:8px;overflow:hidden;margin-bottom:18px;display:none;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .2s;}

  .results{display:none;flex-direction:column;gap:14px;}
  .metric-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .metric-card .mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
  .metric-card .mtitle{font-weight:700;font-size:14px;}
  .metric-card .munit{font-size:11px;color:var(--ink-soft);}
  .bar-row{display:grid;grid-template-columns:130px 1fr 54px;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;}
  .bar-row .name{color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-row .name.me{color:var(--brick);font-weight:700;}
  .bar-track{background:var(--line-soft);border-radius:5px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:5px 0 0 5px;transition:width .4s ease;}
  .bar-fill.me{background:var(--brick);}
  .bar-fill.rank1{background:var(--gold);}
  .bar-row .val{text-align:right;font-weight:700;font-size:12px;}

  .grade-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line-soft);font-size:12.5px;}
  .grade-row:last-child{border-bottom:none;}
  .grade-badge{background:var(--gold-soft);color:var(--gold);font-weight:800;font-size:12.5px;padding:2px 11px;border-radius:20px;min-width:34px;text-align:center;}

  .exportbtn{background:#217346;color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:14px;display:none;}
  .viewtoggle{display:flex;gap:8px;margin-bottom:16px;}
  .viewtoggle button{border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);border-radius:20px;padding:7px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .viewtoggle button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .group-section{}
  .group-title{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .empty-hint{text-align:center;color:#9AA3A0;font-size:14px;padding:60px 20px;border:2px dashed var(--line);border-radius:12px;}


  .server-state{background:rgba(255,255,255,.08);border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.45;}
  .server-state.checking{color:#D5DEDC}.server-state.ok{color:#8FD3C9}.server-state.warn{color:#F4CF88}.server-state.bad{color:#FF9D8B}
  .preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
  .preset-grid button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:7px 5px;font-size:10.5px;cursor:pointer;font-family:inherit;}
  .cache-dot{margin-left:auto;font-size:10px}.cache-dot.fresh{color:#8FD3C9}.cache-dot.mid{color:#F4CF88}.cache-dot.old{color:#FF9D8B}
  .data-stamp{font-size:11.5px;color:var(--ink-soft);margin:-8px 0 15px;min-height:16px}.data-stamp .old-data{color:var(--brick);font-weight:700}
  .benchmark-card,.ratio-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 18px rgba(20,33,61,.035)}
  .benchmark-card.notice{font-size:13px;color:var(--ink-soft);border-left:4px solid var(--accent);}
  .benchmark-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px;flex-wrap:wrap}.bench-eyebrow{font-size:10.5px;letter-spacing:.12em;color:var(--accent);font-weight:800}.benchmark-head h3{font-family:'Noto Serif KR',serif;margin:3px 0 0;font-size:19px}.bench-chips{display:flex;gap:6px;flex-wrap:wrap}.bench-chips span{font-size:10.5px;background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:20px;font-weight:700}
  .benchmark-table-wrap{overflow-x:auto}.benchmark-table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}.benchmark-table th{background:var(--paper);color:var(--ink-soft);font-size:10.5px;padding:8px 9px;border-bottom:1px solid var(--line);text-align:right}.benchmark-table th:first-child,.benchmark-table td:first-child{text-align:left}.benchmark-table td{padding:9px;border-bottom:1px solid var(--line-soft);text-align:right}.benchmark-table .strong{font-weight:800;color:var(--brick)}.benchmark-foot{margin-top:10px;font-size:10.5px;color:#7B8581}
  .ratio-title{font-size:14px;font-weight:800;margin-bottom:12px}.ratio-title span{font-size:10.5px;font-weight:500;color:var(--ink-soft);margin-left:6px}.ratio-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:8px}.ratio-item{background:var(--paper);border-radius:10px;padding:13px}.ratio-label{font-size:10.5px;color:var(--ink-soft);margin-bottom:4px}.ratio-value{font-size:20px;font-weight:800}.ratio-value small{font-size:10.5px;margin-left:3px;color:var(--ink-soft)}.ratio-sub{font-size:10px;color:#7B8581;margin-top:3px}.ratio-empty{font-size:12px;color:var(--ink-soft);padding:8px 0}
  .quality-alert,.quality-ok{font-size:11.5px;border-radius:9px;padding:9px 12px}.quality-alert{background:#FFF3EF;color:#A33D2A;border:1px solid #F3D5CD}.quality-ok{background:var(--accent-soft);color:var(--accent);border:1px solid #CFE1DF}
  .data-error{color:var(--brick);font-weight:700;font-size:10.5px}.data-missing{color:#99A29F}.tiny-unit{font-size:9px;color:var(--ink-soft);font-weight:500}.bar-track.na{background:repeating-linear-gradient(135deg,var(--line-soft),var(--line-soft) 4px,#F7F8F7 4px,#F7F8F7 8px)}
  .bar-row{grid-template-columns:150px 1fr 78px}.group-note,.minor-note{font-size:11.5px;color:var(--ink-soft);margin:-4px 0 10px}.group-body{display:flex;flex-direction:column;gap:12px}.collapsed-group{background:transparent}.group-title.collapsible{cursor:pointer;list-style:none;display:flex;justify-content:space-between}.group-title.collapsible::-webkit-details-marker{display:none}.group-title.collapsible span{font-family:'Pretendard';font-size:10.5px;color:var(--ink-soft);font-weight:500}
  .grade-values{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.current-label{font-size:9px;background:var(--accent);color:#fff;padding:2px 6px;border-radius:10px}.grade-badge.current{background:var(--accent-soft);color:var(--accent)}.grade-badge.old{background:var(--paper);color:var(--ink-soft);font-weight:600}.grade-note{font-size:9.5px;color:var(--ink-soft)}.grade-divider{color:var(--line)}.mine-name{color:var(--brick)!important;font-weight:800!important}
  .table-card{overflow-x:auto}.metric-table{width:100%;border-collapse:collapse;font-size:12px}.metric-table th{border-bottom:2px solid var(--line);padding:8px 10px;text-align:right}.metric-table th:first-child{text-align:left}.metric-table td{border-bottom:1px solid var(--line-soft)}.numcell{text-align:right;padding:8px 10px}.hospital-cell{padding:8px 10px;font-weight:500;white-space:nowrap}.mine-row{background:var(--brick-soft)}.mine-row .hospital-cell{color:var(--brick);font-weight:800}
  .detail-item{padding:10px 0;border-bottom:1px dashed var(--line-soft)}.detail-name{font-weight:600;margin-bottom:6px}.detail-name span,.detail-item summary span{font-weight:400;color:var(--ink-soft);font-size:11px}.detail-item summary{cursor:pointer;font-weight:600}.detail-body{margin-top:6px;font-size:12px;color:var(--ink-soft)}.job-chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin:2px 4px 2px 0;font-size:11px}

  @media (max-width: 820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;max-height:60vh;}
    .main{padding:20px 14px 60px;}
    .ratio-grid{grid-template-columns:repeat(2,1fr);}
    .bar-row{grid-template-columns:112px 1fr 68px;gap:7px;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="eyebrow">HIRA OPEN API</div>
    <div class="versionbadge" id="versionBadge">v3.16</div>
    <h1>상급종합병원 47</h1>

    <div class="keybox" style="border-top:none;margin-top:0;padding-top:0;">
      <label>① 서버 연결 상태</label>
      <div id="serverStatus" class="server-state checking">⏳ Apps Script 프록시 연결 확인 중…</div>
    </div>

    <div class="keybox">
      <label>⚡ 속도 (동시 처리 병원 수): <span id="concLabel">8</span>곳</label>
      <input type="range" id="concSlider" min="1" max="15" value="8"
        oninput="CONCURRENCY = Number(this.value); document.getElementById('concLabel').textContent = this.value;"
        style="width:100%;accent-color:#8FD3C9;">
      <div style="font-size:10.5px;color:rgba(255,255,255,.45);margin-top:4px;">실패한 병원은 속도를 자동으로 낮춰 다시 시도합니다. 직접 안 만지셔도 됩니다.</div>
    </div>
    <button class="runbtn" id="runBtn" onclick="runCompare()">② 선택 병원 비교 시작</button>
    <button class="runbtn" style="background:transparent;border:1px solid rgba(255,255,255,.25);margin-top:6px;font-size:11px;padding:8px;" onclick="tryLoadCache()">이전 캐시 불러오기</button>
    <button class="runbtn" style="background:transparent;border:1px solid rgba(255,255,255,.25);margin-top:6px;font-size:11px;padding:8px;" onclick="clearCache()">저장된 캐시 지우기</button>

    <div style="margin:18px 0 8px;font-size:11px;color:rgba(255,255,255,.5);">③ 비교할 병원 선택</div>
    <input type="text" id="filterInput" placeholder="병원명 검색…" oninput="filterList()">
    <div class="preset-grid">
      <button onclick="selectPreset('all')">전체 47개</button>
      <button onclick="selectPreset('region')">경기남부권</button>
      <button onclick="selectPreset('default')">기본 비교 4곳</button>
      <button onclick="selectAll(false)">전체해제</button>
    </div>
    <div id="hospListBox"></div>
  </div>

  <div class="main">
    <div class="top">
      <h2>인프라 비교 결과 <span id="mainVersion" style="font-family:'Pretendard';font-size:13px;background:var(--brick-soft);color:var(--brick);padding:3px 10px;border-radius:20px;vertical-align:middle;">v3.16</span></h2>
      <div class="src">병원정보서비스 · 의료기관별상세정보서비스</div>
    </div>
    <div class="status" id="status"></div>
    <div id="dataStamp" class="data-stamp"></div>
    <div id="elapsedTime" style="display:none;font-size:12px;color:var(--accent);font-weight:600;margin:-6px 0 10px;"></div>
    <div class="progress-track" id="progTrack"><div class="progress-fill" id="progFill"></div></div>
    <div class="viewtoggle" id="viewToggle" style="display:none;">
      <button id="viewGraphBtn" class="on" onclick="setViewMode('graph')">📊 그래프형</button>
      <button id="viewTableBtn" onclick="setViewMode('table')">🗂 표형</button>
    </div>

    <div id="emptyHint" class="empty-hint">왼쪽에서 병원을 선택하고 [비교 시작]을 눌러주세요.</div>
    <div class="results" id="results"></div>
    <button class="exportbtn" id="exportBtn" onclick="exportExcel()">📊 엑셀로 다운로드</button>
  </div>

</div>

<script>
const APP_VERSION = "3.16";
const MY_HOSPITAL = "한림대학교성심병원";
const MY_REGION = "경기남부권";
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyhyoMXpqhexIxlhkUv64ucPmP8-N2AMl5sb4zrj3-m6Ufdh3tYjxWLhW0JMvslOcFVdQ/exec";

// 제5기(2024~2026) 상급종합병원 47개소 — [검색용 병원명, 권역]
const HOSPITALS = [
  ["한림대학교성심병원","경기남부권"],
  ["강북삼성병원","서울권"],["건국대학교병원","서울권"],["경희대학교병원","서울권"],
  ["고려대학교구로병원","서울권"],["삼성서울병원","서울권"],["서울대학교병원","서울권"],
  ["강남세브란스병원","서울권"],["세브란스병원","서울권"],["이화여자대학교부속목동병원","서울권"],
  ["서울아산병원","서울권"],["중앙대학교병원","서울권"],["고려대학교안암병원","서울권"],
  ["가톨릭대학교서울성모병원","서울권"],["한양대학교병원","서울권"],
  ["가톨릭대학교인천성모병원","경기서북부권"],["가천대학교길병원","경기서북부권"],
  ["인하대학교병원","경기서북부권"],["순천향대학교부속부천병원","경기서북부권"],
  ["가톨릭대학교성빈센트병원","경기남부권"],["고려대학교안산병원","경기남부권"],
  ["분당서울대학교병원","경기남부권"],["아주대학교병원","경기남부권"],
  ["강릉아산병원","강원권"],["연세대학교원주세브란스기독병원","강원권"],
  ["충북대학교병원","충청권"],["건양대학교병원","충청권"],["충남대학교병원","충청권"],
  ["단국대학교병원","충청권"],
  ["원광대학교병원","호남제주권"],["전북대학교병원","호남제주권"],
  ["전남대학교병원","호남제주권"],["조선대학교병원","호남제주권"],["화순전남대학교병원","호남제주권"],
  ["경북대학교병원","영남권"],["계명대학교동산병원","영남권"],["대구가톨릭대학교병원","영남권"],
  ["영남대학교병원","영남권"],["칠곡경북대학교병원","영남권"],
  ["고신대학교복음병원","영남권"],["동아대학교병원","영남권"],["부산대학교병원","영남권"],
  ["양산부산대학교병원","영남권"],["인제대학교부산백병원","영남권"],["울산대학교병원","영남권"],
  ["경상국립대학교병원","영남권"],["성균관대학교삼성창원병원","영남권"],
];

const HOSPITAL_REGION = Object.fromEntries(HOSPITALS);
const BASIS_PATH = "B551182/hospInfoServicev2/getHospBasisList";
const DETAIL_BASE_PATH = "B551182/MadmDtlInfoService2.8";
let CONCURRENCY = 8;
let viewMode = "graph";
let selected = new Set([MY_HOSPITAL,"서울대학교병원","삼성서울병원","서울아산병원"]);
let collected = [];

// 상세 API가 병원 단위 Promise.all로 폭주하지 않도록 전체 요청 수도 제한
const MAX_API_INFLIGHT = 16;
const CACHE_SCHEMA = 2; // v3.15 이전 캐시는 0/미조회 구분이 없어 재사용하지 않음
let apiInflight = 0;
const apiWaiters = [];
async function acquireApiSlot(){
  if(apiInflight < MAX_API_INFLIGHT){ apiInflight++; return; }
  await new Promise(resolve => apiWaiters.push(resolve));
  apiInflight++;
}
function releaseApiSlot(){
  apiInflight = Math.max(0, apiInflight - 1);
  const next = apiWaiters.shift();
  if(next) next();
}

const isNum = v => typeof v === "number" && Number.isFinite(v);
const numOrNull = v => (v === null || v === undefined || v === "" || Number.isNaN(Number(v))) ? null : Number(v);
function sumKnown(values){
  const nums = values.map(numOrNull).filter(v=>v!==null);
  return nums.length ? nums.reduce((a,b)=>a+b,0) : null;
}
function fmtDateTime(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return "";
  return new Intl.DateTimeFormat("ko-KR", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
}
function cacheFreshness(ts){
  if(!ts) return {cls:"", label:""};
  const age = Date.now() - new Date(ts).getTime();
  if(age <= 86400000) return {cls:"fresh", label:"24시간 이내"};
  if(age <= 7*86400000) return {cls:"mid", label:"7일 이내"};
  return {cls:"old", label:"7일 초과"};
}

// ---- 로컬 캐시 ----
function saveCache(data){
  try{
    const stamped = { ...data, cacheSchema:CACHE_SCHEMA, ts: data.ts || new Date().toISOString() };
    localStorage.setItem(`infra_${data.name}`, JSON.stringify(stamped));
  }catch(e){ /* 저장소 접근 불가 */ }
}
function loadCache(name){
  try{
    const raw = localStorage.getItem(`infra_${name}`);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed.cacheSchema === CACHE_SCHEMA ? parsed : null;
  }catch(e){ return null; }
}
function clearCache(){
  try{
    HOSPITALS.forEach(([name])=> localStorage.removeItem(`infra_${name}`));
    renderList();
    statusMsg("저장된 캐시를 모두 지웠습니다.");
  }catch(e){ statusMsg("이 화면에서는 캐시 저장소를 사용할 수 없습니다.", true); }
}

function renderList(){
  const box = document.getElementById("hospListBox");
  box.innerHTML = "";
  let lastRegion = "";
  HOSPITALS.forEach(([name, region])=>{
    if(region !== lastRegion){
      const rt = document.createElement("div");
      rt.className = "region-title";
      rt.textContent = region;
      box.appendChild(rt);
      lastRegion = region;
    }
    const row = document.createElement("label");
    row.className = "hitem";
    row.dataset.name = name;
    const isMine = name === MY_HOSPITAL;
    const cached = loadCache(name);
    const fresh = cached ? cacheFreshness(cached.ts) : null;
    const cacheTag = cached ? `<span class="cache-dot ${fresh.cls}" title="캐시 ${fmtDateTime(cached.ts)} · ${fresh.label}">●</span>` : "";
    row.innerHTML = `<input type="checkbox" ${selected.has(name)?"checked":""} onchange="toggleHosp('${name}', this.checked)">
      <span class="${isMine?'mine':''}">${name}</span>${cacheTag}`;
    box.appendChild(row);
  });
}
function toggleHosp(name, on){ on ? selected.add(name) : selected.delete(name); }
function selectAll(on){
  document.querySelectorAll('#hospListBox input[type=checkbox]').forEach(cb=>{
    if(cb.closest('.hitem').classList.contains('hidden')) return;
    cb.checked = on;
    toggleHosp(cb.closest('.hitem').dataset.name, on);
  });
}
function selectPreset(type){
  selected.clear();
  if(type === "all") HOSPITALS.forEach(([n])=>selected.add(n));
  if(type === "region") HOSPITALS.filter(([,r])=>r===MY_REGION).forEach(([n])=>selected.add(n));
  if(type === "default") [MY_HOSPITAL,"서울대학교병원","삼성서울병원","서울아산병원"].forEach(n=>selected.add(n));
  renderList();
}
function filterList(){
  const q = document.getElementById("filterInput").value.trim();
  document.querySelectorAll('#hospListBox .hitem').forEach(el=>{
    el.classList.toggle("hidden", q && !el.dataset.name.includes(q));
  });
  document.querySelectorAll('#hospListBox .region-title').forEach(el=>{
    let next = el.nextElementSibling, anyVisible = false;
    while(next && !next.classList.contains('region-title')){
      if(!next.classList.contains('hidden')) anyVisible = true;
      next = next.nextElementSibling;
    }
    el.style.display = anyVisible ? "" : "none";
  });
}

function statusMsg(t, err){
  const el = document.getElementById("status");
  el.textContent = t;
  el.className = "status" + (err?" error":"");
}
function setServerStatus(state, text){
  const el = document.getElementById("serverStatus");
  el.className = `server-state ${state}`;
  el.textContent = text;
}
async function checkServerConnection(){
  setServerStatus("checking", "⏳ Apps Script 프록시 연결 확인 중…");
  try{
    const json = await callApi(BASIS_PATH, { yadmNm: MY_HOSPITAL, numOfRows:1 });
    if(items(json).length){
      setServerStatus("ok", "✅ 프록시 정상 · 인증키 서버 보관");
    }else{
      setServerStatus("warn", "⚠ 연결됨 · 병원정보 응답 확인 필요");
    }
  }catch(e){
    setServerStatus("bad", `❌ 연결 실패 · ${e.message}`);
  }
}

async function callApi(path, params){
  await acquireApiSlot();
  try{
    const qs = new URLSearchParams(Object.assign({ path, pageNo:1, numOfRows:100 }, params));
    let res;
    try{
      res = await fetch(PROXY_URL + "?" + qs.toString(), { signal: AbortSignal.timeout(15000) });
    }catch(e){
      if(e.name === "TimeoutError" || e.name === "AbortError") throw new Error("시간초과(15초)");
      throw new Error("네트워크 오류: " + e.message);
    }
    if(!res.ok) throw new Error("프록시 응답 오류 (" + res.status + ")");
    const json = await res.json();
    const code = json?.response?.header?.resultCode;
    if(code !== undefined && !["00","0000"].includes(String(code))){
      throw new Error(json?.response?.header?.resultMsg || `API 오류(${code})`);
    }
    return json;
  } finally {
    releaseApiSlot();
  }
}
function items(json){
  try{
    const body = json.response && json.response.body;
    const it = body && body.items && body.items.item;
    if(!it) return [];
    return Array.isArray(it) ? it : [it];
  }catch(e){ return []; }
}
const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
async function safeDetailCall(op, ykiho){
  let lastError = null;
  for(let attempt=0; attempt<2; attempt++){
    try{
      return {ok:true, json:await callApi(DETAIL_BASE_PATH + "/" + op, { ykiho })};
    }catch(e){
      lastError = e;
      if(attempt===0) await sleep(250 + Math.random()*250);
    }
  }
  return {ok:false, error:lastError?.message || "조회실패"};
}

async function fetchHospital(name){
  const basis = await callApi(BASIS_PATH, { yadmNm: name });
  const candidates = items(basis);
  // 병원명 부분검색 결과 중 정확히 일치하는 항목 우선
  const bi = candidates.find(x=>x.yadmNm===name) || candidates[0];
  if(!bi) return { name, error: "검색 결과 없음" };

  const ykiho = bi.ykiho;
  const data = {
    name: bi.yadmNm || name,
    region: HOSPITAL_REGION[name] || HOSPITAL_REGION[bi.yadmNm] || "미분류",
    drTotCnt: numOrNull(bi.drTotCnt),
    sdrCnt: sumKnown([bi.mdeptSdrCnt, bi.detySdrCnt, bi.cmdcSdrCnt]),
    mriCnt:null, ctCnt:null, petCnt:null, sonoCnt:null,
    nursingGrade:null, nursingGradePpN:null,
    dgsbjtCnt:null, spclDiagCnt:null, etcHstCnt:null,
    permSbdCnt:null, stdSickbdCnt:null, hghrSickbdCnt:null,
    trnsprtCnt:null, spclHospCnt:null, foepCnt:null,
    spclDiagNames:[], etcHstDetail:{}, fieldStatus:{}, apiErrors:{},
    ts:new Date().toISOString()
  };
  if(data.drTotCnt===null) data.fieldStatus.drTotCnt="missing";
  if(data.sdrCnt===null) data.fieldStatus.sdrCnt="missing";

  const detailCalls = [
    "getMedOftInfo2.8","getNursigGrdInfo2.8","getDgsbjtInfo2.8",
    "getSpclDiagInfo2.8","getEtcHstInfo2.8","getDtlInfo2.8",
    "getTrnsprtInfo2.8","getSpclHospAsgFldList2.8","getFoepAddcInfo2.8",
  ];
  const results = await Promise.all(detailCalls.map(op => safeDetailCall(op, ykiho)));
  const [eqpR, nursR, dgsR, spclR, etcR, dtlR, trnsR, spclHospR, foepR] = results;
  const markError = (result, keys, op)=>{
    if(result.ok) return false;
    keys.forEach(k=>data.fieldStatus[k]="error");
    data.apiErrors[op] = result.error || "조회실패";
    return true;
  };

  if(!markError(eqpR,["mriCnt","ctCnt","petCnt","sonoCnt"],"장비")){
    data.mriCnt=0; data.ctCnt=0; data.petCnt=0; data.sonoCnt=0;
    items(eqpR.json).forEach(e=>{
      const nm = (e.oftCdNm||"").toUpperCase();
      const c = numOrNull(e.oftCnt) ?? 0;
      if(nm.includes("MRI") || nm.includes("자기공명")) data.mriCnt += c;
      if(nm.includes("CT") || nm.includes("전산화") || nm.includes("단층")) data.ctCnt += c;
      if(nm.includes("PET") || nm.includes("양전자")) data.petCnt += c;
      if(nm.includes("초음파")) data.sonoCnt += c;
    });
  }

  if(!markError(nursR,["nursingGrade","nursingGradePpN"],"간호등급")){
    const nursItems = items(nursR.json);
    const oldGrade = nursItems.find(n => String(n.tyCd) === "01");
    const currentGrade = nursItems.find(n => String(n.tyCd) === "05");
    data.nursingGrade = oldGrade?.careGrd ?? null;
    data.nursingGradePpN = currentGrade?.careGrd ?? null;
    if(data.nursingGrade===null) data.fieldStatus.nursingGrade="missing";
    if(data.nursingGradePpN===null) data.fieldStatus.nursingGradePpN="missing";
  }

  if(!markError(dgsR,["dgsbjtCnt"],"진료과목")) data.dgsbjtCnt = items(dgsR.json).length;
  if(!markError(spclR,["spclDiagCnt","spclDiagNames"],"특수진료")){
    data.spclDiagCnt = items(spclR.json).length;
    data.spclDiagNames = items(spclR.json).map(s=>s.srchCdNm).filter(Boolean);
  }
  if(!markError(etcR,["etcHstCnt","etcHstDetail"],"기타인력")){
    const list = items(etcR.json);
    data.etcHstCnt = list.reduce((s,e)=> s + (numOrNull(e.gnlNopCnt) ?? 0), 0);
    list.forEach(e=>{
      const job = e.dtlGnlNopCdNm || "기타";
      data.etcHstDetail[job] = (data.etcHstDetail[job]||0) + (numOrNull(e.gnlNopCnt) ?? 0);
    });
  }

  if(!markError(dtlR,["permSbdCnt","stdSickbdCnt","hghrSickbdCnt"],"병상")){
    const dtlItem = items(dtlR.json)[0];
    if(dtlItem){
      data.permSbdCnt = numOrNull(dtlItem.permSbdCnt);
      data.stdSickbdCnt = numOrNull(dtlItem.stdSickbdCnt);
      data.hghrSickbdCnt = numOrNull(dtlItem.hghrSickbdCnt);
      ["permSbdCnt","stdSickbdCnt","hghrSickbdCnt"].forEach(k=>{ if(data[k]===null) data.fieldStatus[k]="missing"; });
    }else{
      ["permSbdCnt","stdSickbdCnt","hghrSickbdCnt"].forEach(k=>data.fieldStatus[k]="missing");
    }
  }
  if(!markError(trnsR,["trnsprtCnt"],"교통정보")) data.trnsprtCnt = items(trnsR.json).length;
  if(!markError(spclHospR,["spclHospCnt"],"전문병원지정")) data.spclHospCnt = items(spclHospR.json).length;
  if(!markError(foepR,["foepCnt"],"식대가산")) data.foepCnt = items(foepR.json).length;

  return data;
}

async function runPool(list, worker, onProgress){
  const results = new Array(list.length);
  let idx = 0, done = 0;
  async function next(){
    while(idx < list.length){
      const my = idx++;
      try{ results[my] = await worker(list[my]); }
      catch(e){ results[my] = { name:list[my], error:e.message }; }
      done++;
      onProgress(done, list.length);
    }
  }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY,list.length)}, next));
  return results;
}

async function runCompare(){
  const list = [...selected];
  if(list.length === 0){ statusMsg("병원을 1곳 이상 선택해주세요.", true); return; }
  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  document.getElementById("emptyHint").style.display = "none";
  document.getElementById("results").style.display = "none";
  document.getElementById("exportBtn").style.display = "none";
  document.getElementById("viewToggle").style.display = "none";
  document.getElementById("progTrack").style.display = "block";
  document.getElementById("progFill").style.width = "0%";
  document.getElementById("dataStamp").textContent = "";

  const startedAt = Date.now();
  const elapsedStr = () => ((Date.now()-startedAt)/1000).toFixed(1) + "초";
  const timerId = setInterval(()=>{
    document.getElementById("elapsedTime").textContent = "⏱ 경과 " + elapsedStr();
  }, 500);
  document.getElementById("elapsedTime").style.display = "inline";

  const worker = async name=>{
    const d = await fetchHospital(name);
    if(!d.error) saveCache(d);
    return d;
  };
  const onProgress = (done,total)=>{
    document.getElementById("progFill").style.width = Math.round(done/total*100) + "%";
    statusMsg(`수집 중… ${done}/${total} (병원 동시 ${CONCURRENCY} · 전체 API 최대 ${MAX_API_INFLIGHT})`);
  };

  statusMsg(`${list.length}개 병원 수집 중…`);
  collected = await runPool(list, worker, onProgress);

  let retryRound = 0;
  while(collected.some(d=>d.error) && retryRound < 2 && CONCURRENCY > 1){
    const failedNames = collected.filter(d=>d.error).map(d=>d.name);
    CONCURRENCY = Math.max(1, Math.floor(CONCURRENCY/2));
    document.getElementById("concSlider").value = CONCURRENCY;
    document.getElementById("concLabel").textContent = CONCURRENCY;
    statusMsg(`${failedNames.length}곳 재시도 중… (병원 동시 처리 ${CONCURRENCY}로 자동 조정)`);
    const retried = await runPool(failedNames, worker, onProgress);
    const retriedMap = Object.fromEntries(retried.map(d=>[d.name, d]));
    collected = collected.map(d => d.error && retriedMap[d.name] ? retriedMap[d.name] : d);
    retryRound++;
  }

  clearInterval(timerId);
  btn.disabled = false;
  document.getElementById("progTrack").style.display = "none";
  document.getElementById("elapsedTime").style.display = "none";
  const ok = collected.filter(d=>!d.error);
  const totalSec = ((Date.now()-startedAt)/1000).toFixed(1);
  const timeoutCnt = collected.filter(d=>d.error && d.error.includes("시간초과")).length;
  if(ok.length === 0){
    statusMsg(`수집된 데이터가 없습니다. (${totalSec}초 소요)`, true);
    document.getElementById("emptyHint").style.display="block";
    return;
  }
  const detailErrHospCnt = ok.filter(d=>Object.keys(d.apiErrors||{}).length).length;
  const failNote = timeoutCnt > 0 ? ` · 병원 자체 조회 시간초과 ${timeoutCnt}곳` : "";
  const detailNote = detailErrHospCnt ? ` · 일부 세부항목 조회실패 ${detailErrHospCnt}곳` : "";
  statusMsg(`${ok.length}개 병원 수집 완료 · ${totalSec}초${failNote}${detailNote}`);
  renderResults(ok);
  renderList();
  document.getElementById("exportBtn").style.display = "inline-block";
  document.getElementById("viewToggle").style.display = "flex";
}

function tryLoadCache(){
  const cachedList = [...selected].map(loadCache).filter(Boolean);
  if(cachedList.length === 0){ statusMsg("선택 병원 중 캐시된 데이터가 없습니다. 먼저 조회해주세요.", true); return; }
  collected = cachedList;
  document.getElementById("emptyHint").style.display = "none";
  renderResults(cachedList);
  document.getElementById("exportBtn").style.display = "inline-block";
  document.getElementById("viewToggle").style.display = "flex";
  const oldCnt = cachedList.filter(d=>cacheFreshness(d.ts).cls==="old").length;
  statusMsg(`캐시에서 ${cachedList.length}개 병원 데이터를 불러왔습니다.${oldCnt?` · 7일 초과 ${oldCnt}곳`:""}`);
}

function fieldState(d,key){ return d.fieldStatus?.[key] || "ok"; }
function metricText(d,key, unit=""){
  const v = d[key];
  const state = fieldState(d,key);
  if(!isNum(v)){
    if(state === "error") return `<span class="data-error">조회실패</span>`;
    return `<span class="data-missing">—</span>`;
  }
  return `${v.toLocaleString()}${unit ? ` <span class="tiny-unit">${unit}</span>`:""}`;
}
function rawMetricText(d,key){
  const v=d[key], state=fieldState(d,key);
  if(!isNum(v)) return state==="error" ? "조회실패" : "—";
  return v.toLocaleString();
}
function median(arr){
  const a = arr.filter(isNum).sort((x,y)=>x-y);
  if(!a.length) return null;
  const mid = Math.floor(a.length/2);
  return a.length%2 ? a[mid] : (a[mid-1]+a[mid])/2;
}
function rankOf(value, arr){
  if(!isNum(value)) return null;
  const a=arr.filter(isNum);
  if(!a.length) return null;
  return 1 + a.filter(v=>v>value).length;
}
function rankLabel(value, data, key){
  const vals=data.map(d=>d[key]).filter(isNum);
  const rank=rankOf(value, vals);
  return rank ? `${rank}/${vals.length}` : "—";
}
function pctDiff(value, med){
  if(!isNum(value) || !isNum(med)) return "—";
  if(med===0) return value===0 ? "0%" : "비교불가";
  const p=(value-med)/med*100;
  return `${p>=0?"+":""}${p.toFixed(1)}%`;
}
function fmtMedian(v, unit){
  if(!isNum(v)) return "—";
  const shown = Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined,{maximumFractionDigits:1});
  return `${shown}${unit}`;
}

function benchmarkSummary(data){

  if(!me){
    return `<div class="benchmark-card notice"><strong>${MY_HOSPITAL}</strong>을 선택하면 조회군·${MY_REGION} 내 순위와 중앙값 대비를 자동 계산합니다.</div>`;
  }
  const regionData=data.filter(d=>(d.region||HOSPITAL_REGION[d.name])===MY_REGION);
  const allLabel = data.length===HOSPITALS.length ? `상급종합병원 ${data.length}개` : `현재 조회군 ${data.length}개`;
  const regionLabel = regionData.length===HOSPITALS.filter(([,r])=>r===MY_REGION).length ? `${MY_REGION} 전체 ${regionData.length}개` : `${MY_REGION} 조회 ${regionData.length}개`;
  const rows=BENCH_METRICS.map(m=>{
    const med=median(data.map(d=>d[m.key]));
    const regionMed=median(regionData.map(d=>d[m.key]));
    const state=fieldState(me,m.key);
    const myVal=isNum(me[m.key]) ? `${me[m.key].toLocaleString()}${m.unit}` : (state==="error"?"조회실패":"—");
    return `<tr>
      <td>${m.title}</td>
      <td class="strong">${myVal}</td>
      <td>${rankLabel(me[m.key],data,m.key)}</td>
      <td>${fmtMedian(med,m.unit)}</td>
      <td>${pctDiff(me[m.key],med)}</td>
      <td>${rankLabel(me[m.key],regionData,m.key)}</td>
      <td>${fmtMedian(regionMed,m.unit)}</td>
    </tr>`;
  }).join("");
  return `<section class="benchmark-card">
    <div class="benchmark-head">
      <div>
        <div class="bench-eyebrow">BENCHMARK SUMMARY</div>
        <h3>${MY_HOSPITAL}</h3>
      </div>
      <div class="bench-chips"><span>${allLabel}</span><span>${regionLabel}</span></div>
    </div>
    <div class="benchmark-table-wrap"><table class="benchmark-table">
      <thead><tr><th>지표</th><th>우리병원</th><th>조회군 순위</th><th>조회군 중앙값</th><th>중앙값 대비</th><th>${MY_REGION} 순위</th><th>권역 중앙값</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="benchmark-foot">※ 순위는 실제로 조회된 병원만을 기준으로 계산합니다. 전체 47개 선택 시에만 47개 전체 순위가 됩니다.</div>
  </section>`;
}

function scaleAdjustedSummary(data){
  const me=data.find(d=>d.name===MY_HOSPITAL);
  if(!me) return "";
  if(!isNum(me.permSbdCnt) || me.permSbdCnt<=0){
    return `<section class="ratio-card"><div class="ratio-title">규모 보정 지표 <span>허가병상 기준</span></div><div class="ratio-empty">허가병상 데이터가 확인되면 100병상당 인력 및 1,000병상당 장비를 자동 계산합니다.</div></section>`;
  }
  const defs=[
    {key:"drTotCnt",title:"100병상당 의사",scale:100,unit:"명"},
    {key:"sdrCnt",title:"100병상당 전문의",scale:100,unit:"명"},
    {key:"mriCnt",title:"1,000병상당 MRI",scale:1000,unit:"대"},
    {key:"ctCnt",title:"1,000병상당 CT",scale:1000,unit:"대"},
    {key:"petCnt",title:"1,000병상당 PET",scale:1000,unit:"대"},
  ];
  const calc=(d,def)=> isNum(d[def.key])&&isNum(d.permSbdCnt)&&d.permSbdCnt>0 ? d[def.key]/d.permSbdCnt*def.scale : null;
  const cards=defs.map(def=>{
    const my=calc(me,def);
    const vals=data.map(d=>calc(d,def)).filter(isNum);
    const med=median(vals);
    return `<div class="ratio-item"><div class="ratio-label">${def.title}</div><div class="ratio-value">${isNum(my)?my.toFixed(1):"—"}<small>${def.unit}</small></div><div class="ratio-sub">조회군 중앙값 ${isNum(med)?med.toFixed(1):"—"}</div></div>`;
  }).join("");
  return `<section class="ratio-card"><div class="ratio-title">규모 보정 지표 <span>허가병상수 기준 · 참고지표</span></div><div class="ratio-grid">${cards}</div></section>`;
}

function renderDataStamp(data){
  const stamps=data.map(d=>d.ts).filter(Boolean).map(x=>new Date(x)).filter(d=>!Number.isNaN(d.getTime()));
  if(!stamps.length){ document.getElementById("dataStamp").textContent="조회시각 정보 없음"; return; }
  const min=new Date(Math.min(...stamps.map(d=>d.getTime())));
  const max=new Date(Math.max(...stamps.map(d=>d.getTime())));
  const old=data.filter(d=>cacheFreshness(d.ts).cls==="old").length;
  const same=Math.abs(max-min)<60000;
  document.getElementById("dataStamp").innerHTML = `데이터 조회시각: <strong>${fmtDateTime(max.toISOString())}</strong>${same?"":` · 혼합 캐시 (가장 오래된 ${fmtDateTime(min.toISOString())})`}${old?` · <span class="old-data">7일 초과 ${old}곳</span>`:""}`;
}

function barCard(m, data){
  const {key,title,unit}=m;
  const valid=data.filter(d=>isNum(d[key]));
  const max=Math.max(...valid.map(d=>d[key]),1);
  const sorted=[...data].sort((a,b)=>{
    const av=isNum(a[key])?a[key]:-Infinity, bv=isNum(b[key])?b[key]:-Infinity;
    return bv-av;
  });
  let rankCounter=0;
  const rows=sorted.map(d=>{
    const has=isNum(d[key]);
    if(has) rankCounter++;
    const pct=has ? Math.round(d[key]/max*100) : 0;
    const isMine=d.name===MY_HOSPITAL;
    const isRank1=has && rankCounter===1;
    const fillCls="bar-fill"+(isMine?" me":(isRank1?" rank1":""));
    return `<div class="bar-row">
      <div class="name${isMine?' me':''}" title="${d.name}">${d.name}</div>
      <div class="bar-track ${has?'':'na'}"><div class="${fillCls}" style="width:${pct}%"></div></div>
      <div class="val">${metricText(d,key)}</div>
    </div>`;
  }).join("");
  return `<div class="metric-card"><div class="mhead"><div class="mtitle">${title}</div><div class="munit">${unit}</div></div>${rows}</div>`;
}
function gradeFmt(d,key){
  const v=d[key], state=fieldState(d,key);
  if(v===null || v===undefined || v==="") return state==="error" ? "조회실패" : "정보없음";
  return `${v}등급`;
}
function gradeCard(data){
  const rows=data.map(d=>{
    const isMine=d.name===MY_HOSPITAL;
    return `<div class="grade-row">
      <div class="${isMine?'mine-name':''}">${d.name}</div>
      <div class="grade-values">
        <span class="current-label">현재 적용</span><span class="grade-badge current">${gradeFmt(d,"nursingGradePpN")}</span><span class="grade-note">환자수 기준</span>
        <span class="grade-divider">|</span><span class="grade-badge old">${gradeFmt(d,"nursingGrade")}</span><span class="grade-note">종전 병상수 기준</span>
      </div>
    </div>`;
  }).join("");
  return `<div class="metric-card"><div class="mhead"><div class="mtitle">간호등급 (건강보험)</div><div class="munit">환자수 기준을 현재 적용값으로 강조</div></div>${rows}</div>`;
}
function groupTable(group,data){
  const head=`<th style="text-align:left;">병원</th>`+group.metrics.map(m=>`<th>${m.title}</th>`).join("");
  const rows=data.map(d=>{
    const isMine=d.name===MY_HOSPITAL;
    const cells=group.metrics.map(m=>`<td class="numcell">${metricText(d,m.key)}</td>`).join("");
    return `<tr class="${isMine?'mine-row':''}"><td class="hospital-cell">${d.name}</td>${cells}</tr>`;
  }).join("");
  return `<div class="metric-card table-card"><table class="metric-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function etcHstDetailCard(data){
  const rows=data.map(d=>{
    const isMine=d.name===MY_HOSPITAL;
    const jobs=Object.entries(d.etcHstDetail||{}).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1])
      .map(([job,cnt])=>`<span class="job-chip">${job} ${cnt}명</span>`).join("");
    const status=fieldState(d,"etcHstCnt");
    const empty=status==="error"?'<span class="data-error">조회실패</span>':'<span class="data-missing">등록된 직종 없음</span>';
    return `<div class="detail-item"><div class="detail-name ${isMine?'mine-name':''}">${d.name} <span>(총 ${rawMetricText(d,"etcHstCnt")}명)</span></div><div>${jobs||empty}</div></div>`;
  }).join("");
  return `<div class="metric-card"><div class="mhead"><div class="mtitle">기타 인력 직종별 상세</div><div class="munit">약사·물리치료사 등</div></div><div class="minor-note">의사·간호사는 포함되지 않습니다.</div>${rows}</div>`;
}
function spclDiagListCard(data){
  const rows=data.map(d=>{
    const isMine=d.name===MY_HOSPITAL;
    const state=fieldState(d,"spclDiagCnt");
    const names=(d.spclDiagNames||[]).join(", ");
    const body=state==="error"?'<span class="data-error">조회실패</span>':(names||"등록된 분야 없음");
    return `<details class="detail-item"><summary class="${isMine?'mine-name':''}">${d.name} <span>(${rawMetricText(d,"spclDiagCnt")}개 · 클릭해서 목록보기)</span></summary><div class="detail-body">${body}</div></details>`;
  }).join("");
  return `<div class="metric-card"><div class="mhead"><div class="mtitle">특수진료 가능분야 목록</div><div class="munit">병원명 클릭 시 펼침</div></div>${rows}</div>`;
}
function groupSectionHtml(group,data){
  let body;
  if(group.special==="grade") body=gradeCard(data);
  else if(group.special==="etcHstDetail") body=etcHstDetailCard(data);
  else if(group.special==="spclDiagList") body=spclDiagListCard(data);
  else if(viewMode==="table") body=groupTable(group,data);
  else body=group.metrics.map(m=>barCard(m,data)).join("");

  const inner=`${group.note?`<div class="group-note">${group.note}</div>`:""}<div class="group-body">${body}</div>`;
  if(group.collapsed){
    return `<details class="group-section collapsed-group"><summary class="group-title collapsible">${group.title}<span>펼쳐보기</span></summary>${inner}</details>`;
  }
  return `<div class="group-section"><div class="group-title">${group.title}</div>${inner}</div>`;
}
function setViewMode(mode){
  viewMode=mode;
  document.getElementById("viewGraphBtn").classList.toggle("on",mode==="graph");
  document.getElementById("viewTableBtn").classList.toggle("on",mode==="table");
  const ok=collected.filter(d=>!d.error);
  if(ok.length) renderResults(ok);
}
function renderResults(data){
  const box=document.getElementById("results");
  box.style.display="flex";
  box.style.flexDirection="column";
  box.style.gap="22px";
  const groups=[
    METRIC_GROUPS[0], {title:"기타 인력 직종별 상세",special:"etcHstDetail"},
    METRIC_GROUPS[1], {title:"간호등급",special:"grade"},
    METRIC_GROUPS[2], {title:"특수진료 가능분야 목록",special:"spclDiagList"},
    METRIC_GROUPS[3], METRIC_GROUPS[4],
  ];
  const detailErrorTotal=data.reduce((s,d)=>s+Object.keys(d.apiErrors||{}).length,0);
  const legend = `표시 기준: <strong>0</strong>=API가 실제 0 반환 · <strong>—</strong>=값 미제공 · <strong>조회실패</strong>=API 호출 실패`;
  const qualityNote=detailErrorTotal ? `<div class="quality-alert">⚠ 일부 세부 API 조회실패 ${detailErrorTotal}건은 0으로 처리하지 않았습니다. · ${legend}</div>` : `<div class="quality-ok">✓ 조회된 세부 API에서 오류가 감지되지 않았습니다. · ${legend}</div>`;
  box.innerHTML=benchmarkSummary(data)+scaleAdjustedSummary(data)+qualityNote+groups.map(g=>groupSectionHtml(g,data)).join("");
  renderDataStamp(data);
}

function exportExcel(){
  const data=collected.filter(d=>!d.error);
  if(!data.length) return;
  const rows=data.map(d=>({
    "병원명":d.name,"권역":d.region||HOSPITAL_REGION[d.name],"데이터조회시각":d.ts?fmtDateTime(d.ts):"",
    "의사총수":d.drTotCnt,"전문의수":d.sdrCnt,"MRI":d.mriCnt,"CT":d.ctCnt,"PET":d.petCnt,"초음파":d.sonoCnt,
    "간호등급(환자수기준,건보)":d.nursingGradePpN,"간호등급(병상수기준,건보)":d.nursingGrade,"진료과목수":d.dgsbjtCnt,
    "특수진료분야수":d.spclDiagCnt,"기타인력총수":d.etcHstCnt,"허가병상수":d.permSbdCnt,"일반병상수":d.stdSickbdCnt,"상급병상수":d.hghrSickbdCnt,
    "교통정보항목수":d.trnsprtCnt,"전문병원지정분야수":d.spclHospCnt,"식대가산항목수":d.foepCnt,
    "조회실패API":Object.entries(d.apiErrors||{}).map(([k,v])=>`${k}: ${v}`).join(" | "),
    "100병상당의사":isNum(d.drTotCnt)&&isNum(d.permSbdCnt)&&d.permSbdCnt>0?d.drTotCnt/d.permSbdCnt*100:null,
    "100병상당전문의":isNum(d.sdrCnt)&&isNum(d.permSbdCnt)&&d.permSbdCnt>0?d.sdrCnt/d.permSbdCnt*100:null,
    "1000병상당MRI":isNum(d.mriCnt)&&isNum(d.permSbdCnt)&&d.permSbdCnt>0?d.mriCnt/d.permSbdCnt*1000:null,
    "1000병상당CT":isNum(d.ctCnt)&&isNum(d.permSbdCnt)&&d.permSbdCnt>0?d.ctCnt/d.permSbdCnt*1000:null,
  }));
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb,ws,"병원비교");

  const me=data.find(d=>d.name===MY_HOSPITAL);
  if(me){
    const regionData=data.filter(d=>(d.region||HOSPITAL_REGION[d.name])===MY_REGION);
    const bench=BENCH_METRICS.map(m=>{
      const med=median(data.map(d=>d[m.key]));
      const rmed=median(regionData.map(d=>d[m.key]));
      return {"지표":m.title,"우리병원":me[m.key],"조회군순위":rankLabel(me[m.key],data,m.key),"조회군중앙값":med,"중앙값대비":pctDiff(me[m.key],med),"권역순위":rankLabel(me[m.key],regionData,m.key),"권역중앙값":rmed};
    });
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bench),"벤치마크요약");
  }
  XLSX.writeFile(wb,`병원인프라비교_v${APP_VERSION}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function initApp(){
  document.title=`타병원 인프라 비교 v${APP_VERSION}`;
  document.getElementById("versionBadge").textContent=`v${APP_VERSION}`;
  document.getElementById("mainVersion").textContent=`v${APP_VERSION}`;
  renderList();
  checkServerConnection();
}
initApp();
</script>

</body>
