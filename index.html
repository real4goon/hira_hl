<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내가먹는약 안내 현황</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/l10n/ko.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#1b3a5c; --navy-light:#2e5484; --bg:#f4f6f9; --card:#ffffff;
    --line:#e2e6ec; --text:#232a33; --muted:#6b7684; --green:#2e9e5b; --red:#d6455d; --amber:#e0a129;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  header h1{font-size:17px;margin:0;font-weight:700;}
  nav{display:flex;gap:6px;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;}
  nav button.active{background:#fff;color:var(--navy);font-weight:700;border-color:#fff;}
  main{max-width:1100px;margin:0 auto;padding:18px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--navy);}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
  select, input[type=number], input[type=text], input[type=password]{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;
  }
  .dept-name-display{font-size:22px;font-weight:800;color:var(--navy);text-align:center;padding:10px 0;}
  .ampm-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .ampm-toggle button{flex:1;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:14px;}
  .ampm-toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .field{margin-bottom:10px;}
  .total-box{background:#eef2f8;border-radius:8px;padding:10px;text-align:center;font-size:15px;font-weight:700;color:var(--navy);margin:10px 0;}
  .btn{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--navy-light);}
  .btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn.danger{background:var(--red);}
  .msg{font-size:13px;margin-top:8px;padding:8px;border-radius:6px;}
  .msg.ok{background:#e7f7ee;color:var(--green);}
  .msg.err{background:#fdeaec;color:var(--red);}
  /* modal */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:10px;padding:24px;max-width:360px;width:90%;text-align:center;}
  .modal p{font-size:15px;line-height:1.5;}
  .modal .row{display:flex;gap:10px;margin-top:16px;}
  .modal .row button{flex:1;padding:10px;border-radius:6px;border:none;cursor:pointer;font-size:14px;}
  /* 통계 */
  .stat-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  table.heat{width:100%;border-collapse:collapse;font-size:13px;}
  table.heat th,table.heat td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  table.heat th{background:#f0f3f7;}
  canvas{max-height:300px;}
  .chart-wrap{margin-top:14px;}
  /* 마스터 */
  .status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .status-item{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;}
  .status-item .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
  .dot.green{background:var(--green);} .dot.red{background:var(--red);} .dot.amber{background:var(--amber);}
  #masterLoginBox{max-width:320px;margin:40px auto;text-align:center;}
  @media print{
    header, nav, .no-print{display:none !important;}
    body{background:#fff;}
    .card{border:none;box-shadow:none;}
  }
</style>
</head>
<body>

<header class="no-print">
  <h1>심평원 내가먹는약 안내 현황</h1>
  <nav>
    <button data-view="entry" class="active">부서 입력</button>
    <button data-view="stats">통계</button>
    <button data-view="master">마스터</button>
  </nav>
</header>

<main>
  <!-- ===== 1) 부서 입력 화면 ===== -->
  <section id="view-entry" class="view active">
    <div class="card">
      <h2 id="todayDateLabel">오늘 날짜</h2>
      <div class="field">
        <label>부서 선택</label>
        <select id="deptSelect"><option value="">부서를 선택하세요</option></select>
      </div>
      <div id="deptNameDisplay" class="dept-name-display"></div>

      <div class="ampm-toggle">
        <button id="btnAm" data-ampm="오전" class="active">오전</button>
        <button id="btnPm" data-ampm="오후">오후</button>
      </div>

      <div class="grid2">
        <div class="field"><label>조회</label><input type="number" id="f_joh" min="0" value="0"></div>
        <div class="field"><label>미조회 - 인증서 無</label><input type="number" id="f_cert" min="0" value="0"></div>
        <div class="field"><label>미조회 - 비밀번호 분실</label><input type="number" id="f_pw" min="0" value="0"></div>
        <div class="field"><label>미조회 - 안내 거부</label><input type="number" id="f_refuse" min="0" value="0"></div>
        <div class="field"><label>미조회 - 기타</label><input type="number" id="f_etc" min="0" value="0"></div>
        <div class="field"><label>작성자</label><input type="text" id="f_writer" placeholder="이름 입력"></div>
      </div>
      <div class="total-box">계: <span id="totalDisplay">0</span> 건</div>

      <button class="btn" id="submitBtn" style="width:100%;">저장</button>
      <div id="entryMsg"></div>
    </div>
  </section>

  <!-- ===== 2) 통계/대시보드 화면 ===== -->
  <section id="view-stats" class="view">
    <div class="card">
      <div class="stat-toolbar">
        <div>
          <label>조회 날짜</label>
          <input type="text" id="statDate" placeholder="날짜 선택">
        </div>
        <button class="btn secondary no-print" id="printBtn" style="margin-left:auto;">인쇄 / PDF</button>
      </div>
      <h2>부서별 현황 (선택일)</h2>
      <div id="heatTableWrap">데이터를 불러오는 중...</div>
    </div>

    <div class="card">
      <h2>시간대별 비교 (오전 vs 오후, 선택일)</h2>
      <div class="chart-wrap"><canvas id="chartAmPm"></canvas></div>
    </div>

    <div class="card">
      <h2>요일별 분석 (최근 8주 평균 미조회율)</h2>
      <div class="chart-wrap"><canvas id="chartWeekday"></canvas></div>
    </div>

    <div class="card">
      <h2>월별 통계 (최근 6개월)</h2>
      <div class="chart-wrap"><canvas id="chartMonthly"></canvas></div>
    </div>
  </section>

  <!-- ===== 3) 마스터 화면 ===== -->
  <section id="view-master" class="view">
    <div id="masterLoginBox" class="card">
      <h2>마스터 로그인</h2>
      <input type="password" id="masterPw" placeholder="비밀번호">
      <button class="btn" id="masterLoginBtn" style="width:100%;margin-top:10px;">로그인</button>
      <div id="masterLoginMsg"></div>
    </div>

    <div id="masterPanel" style="display:none;">
      <div class="card">
        <h2>오늘 부서별 입력 현황</h2>
        <div class="status-grid" id="statusGrid"></div>
      </div>

      <div class="card">
        <h2>잠금 해제 (마감된 날짜 수정 허용)</h2>
        <div class="grid2">
          <div class="field"><label>날짜</label><input type="text" id="unlockDate" placeholder="YYYY-MM-DD"></div>
          <div class="field"><label>부서</label><select id="unlockDept"></select></div>
        </div>
        <button class="btn secondary" id="unlockBtn">잠금 해제</button>
        <div id="unlockMsg"></div>
      </div>

      <div class="card">
        <h2>부서 목록 관리</h2>
        <div class="grid2">
          <div class="field"><label>부서 추가</label><input type="text" id="newDeptName" placeholder="새 부서명"></div>
          <div style="align-self:end;"><button class="btn secondary" id="addDeptBtn" style="width:100%;">추가</button></div>
        </div>
        <div class="grid2">
          <div class="field"><label>부서 삭제(사용중지)</label><select id="removeDeptSelect"></select></div>
          <div style="align-self:end;"><button class="btn danger" id="removeDeptBtn" style="width:100%;">삭제</button></div>
        </div>
        <div id="deptMgmtMsg"></div>
      </div>
    </div>
  </section>
</main>

<!-- 제출 확인 모달 -->
<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <p id="confirmText"></p>
    <div class="row">
      <button class="secondary" id="confirmCancel" style="background:#eee;">취소</button>
      <button id="confirmOk" style="background:var(--navy);color:#fff;">확인</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ⚠️ 배포 전 필수 설정: Apps Script 웹앱 배포 후 발급되는 URL을 아래에 입력하세요.
   예) const SCRIPT_URL = "https://script.google.com/macros/s/AKfyc.../exec";
========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwdIB9hSTnNAdLoxNlf9bkigbnKcwRxgoWTVP2NC9UcSGamfBoH1AOuzzSIESBdEFbr/exec
";

async function callApi(action, payload) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight 회피
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

/* ---------- 공통: 탭 전환 ---------- */
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'stats') loadStatsView();
  });
});

const todayStr = new Date().toISOString().slice(0,10);
document.getElementById('todayDateLabel').textContent = todayStr + ' 입력';

/* ---------- 1) 부서 입력 화면 ---------- */
let currentAmpm = '오전';
let departments = [];

async function initEntryView() {
  const res = await callApi('getDepartments', {});
  if (res.ok) {
    departments = res.departments;
    const sel = document.getElementById('deptSelect');
    departments.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    });
    const last = localStorage.getItem('lastDept');
    if (last && departments.includes(last)) {
      sel.value = last;
      onDeptChange();
    }
  }
  // 마스터 화면 select 도 채워두기
  populateMasterDeptSelects();
}

document.getElementById('deptSelect').addEventListener('change', onDeptChange);
function onDeptChange() {
  const val = document.getElementById('deptSelect').value;
  document.getElementById('deptNameDisplay').textContent = val;
  if (val) { localStorage.setItem('lastDept', val); loadTodayEntry(); }
}

[document.getElementById('btnAm'), document.getElementById('btnPm')].forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('btnAm').classList.remove('active');
    document.getElementById('btnPm').classList.remove('active');
    btn.classList.add('active');
    currentAmpm = btn.dataset.ampm;
    loadTodayEntry();
  });
});

['f_joh','f_cert','f_pw','f_refuse','f_etc'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateTotal);
});
function updateTotal() {
  const vals = ['f_joh','f_cert','f_pw','f_refuse','f_etc'].map(id => Number(document.getElementById(id).value) || 0);
  document.getElementById('totalDisplay').textContent = vals.reduce((a,b)=>a+b,0);
}

async function loadTodayEntry() {
  const dept = document.getElementById('deptSelect').value;
  if (!dept) return;
  const res = await callApi('getTodayEntry', { dept, ampm: currentAmpm });
  const msg = document.getElementById('entryMsg');
  if (res.ok && res.entry) {
    const e = res.entry;
    document.getElementById('f_joh').value = e.joh;
    document.getElementById('f_cert').value = e.mj_cert;
    document.getElementById('f_pw').value = e.mj_pw;
    document.getElementById('f_refuse').value = e.mj_refuse;
    document.getElementById('f_etc').value = e.mj_etc;
    document.getElementById('f_writer').value = e.writer;
    updateTotal();
    msg.className = 'msg ok';
    msg.textContent = '오늘 이미 입력하신 내역입니다. 수정 후 다시 저장하면 갱신됩니다.';
  } else {
    ['f_joh','f_cert','f_pw','f_refuse','f_etc'].forEach(id => document.getElementById(id).value = 0);
    document.getElementById('f_writer').value = '';
    updateTotal();
    msg.textContent = '';
  }
}

document.getElementById('submitBtn').addEventListener('click', () => {
  const dept = document.getElementById('deptSelect').value;
  if (!dept) { alert('부서를 선택하세요.'); return; }
  const total = document.getElementById('totalDisplay').textContent;
  document.getElementById('confirmText').textContent = `${dept} ${currentAmpm} 입력 – 계 ${total}건 맞습니까?`;
  document.getElementById('confirmModal').classList.add('active');
});
document.getElementById('confirmCancel').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.remove('active');
});
document.getElementById('confirmOk').addEventListener('click', async () => {
  document.getElementById('confirmModal').classList.remove('active');
  const payload = {
    date: todayStr,
    dept: document.getElementById('deptSelect').value,
    ampm: currentAmpm,
    joh: document.getElementById('f_joh').value,
    mjCert: document.getElementById('f_cert').value,
    mjPw: document.getElementById('f_pw').value,
    mjRefuse: document.getElementById('f_refuse').value,
    mjEtc: document.getElementById('f_etc').value,
    writer: document.getElementById('f_writer').value
  };
  const msg = document.getElementById('entryMsg');
  msg.className = 'msg'; msg.textContent = '저장 중...';
  document.getElementById('submitBtn').disabled = true;
  const res = await callApi('submitEntry', payload);
  document.getElementById('submitBtn').disabled = false;
  if (res.ok) {
    msg.className = 'msg ok'; msg.textContent = '저장되었습니다.';
  } else {
    msg.className = 'msg err'; msg.textContent = '오류: ' + res.error;
  }
});

/* ---------- 2) 통계 화면 ---------- */
let statPicker;
let statsCache = [];
let charts = {};

function initStatsPicker() {
  statPicker = flatpickr('#statDate', {
    locale: 'ko',
    defaultDate: todayStr,
    onChange: () => renderHeatTable()
  });
}

async function loadStatsView() {
  if (!statPicker) initStatsPicker();
  const to = todayStr;
  const from = new Date(new Date().setMonth(new Date().getMonth() - 6)).toISOString().slice(0,10);
  const res = await callApi('getStats', { from, to });
  if (res.ok) {
    statsCache = res.rows;
    renderHeatTable();
    renderAmPmChart();
    renderWeekdayChart();
    renderMonthlyChart();
  }
}

function renderHeatTable() {
  const sel = statPicker.selectedDates[0] ? statPicker.formatDate(statPicker.selectedDates[0], 'Y-m-d') : todayStr;
  const rows = statsCache.filter(r => r.date === sel);
  const byDept = {};
  rows.forEach(r => {
    if (!byDept[r.dept]) byDept[r.dept] = {};
    byDept[r.dept][r.ampm] = r;
  });
  let html = '<table class="heat"><tr><th>부서</th><th>오전 조회</th><th>오전 미조회</th><th>오후 조회</th><th>오후 미조회</th></tr>';
  Object.keys(byDept).sort().forEach(dept => {
    const am = byDept[dept]['오전'], pm = byDept[dept]['오후'];
    const amMiss = am ? (am.total - am.joh) : '-';
    const pmMiss = pm ? (pm.total - pm.joh) : '-';
    html += `<tr><td>${dept}</td><td>${am?am.joh:'-'}</td><td style="color:${amMiss>0?'#d6455d':'inherit'}">${amMiss}</td><td>${pm?pm.joh:'-'}</td><td style="color:${pmMiss>0?'#d6455d':'inherit'}">${pmMiss}</td></tr>`;
  });
  html += '</table>';
  if (Object.keys(byDept).length === 0) html = '<p style="color:#888;">해당 날짜 데이터가 없습니다.</p>';
  document.getElementById('heatTableWrap').innerHTML = html;
}

function destroyChart(key) { if (charts[key]) charts[key].destroy(); }

function renderAmPmChart() {
  const sel = statPicker.selectedDates[0] ? statPicker.formatDate(statPicker.selectedDates[0], 'Y-m-d') : todayStr;
  const rows = statsCache.filter(r => r.date === sel);
  const amRows = rows.filter(r => r.ampm === '오전');
  const pmRows = rows.filter(r => r.ampm === '오후');
  const sum = arr => arr.reduce((s,r)=>s+r.total,0);
  const sumJoh = arr => arr.reduce((s,r)=>s+r.joh,0);
  destroyChart('ampm');
  charts.ampm = new Chart(document.getElementById('chartAmPm'), {
    type: 'bar',
    data: {
      labels: ['오전','오후'],
      datasets: [
        { label: '조회', data: [sumJoh(amRows), sumJoh(pmRows)], backgroundColor: '#2e9e5b' },
        { label: '미조회', data: [sum(amRows)-sumJoh(amRows), sum(pmRows)-sumJoh(pmRows)], backgroundColor: '#d6455d' }
      ]
    },
    options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderWeekdayChart() {
  const wdNames = ['일','월','화','수','목','금','토'];
  const buckets = Array.from({length:7}, () => ({joh:0,total:0}));
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 56);
  statsCache.forEach(r => {
    const d = new Date(r.date);
    if (d < cutoff) return;
    const wd = d.getDay();
    buckets[wd].joh += r.joh;
    buckets[wd].total += r.total;
  });
  const rates = buckets.map(b => b.total ? Math.round((b.total-b.joh)/b.total*1000)/10 : 0);
  destroyChart('weekday');
  charts.weekday = new Chart(document.getElementById('chartWeekday'), {
    type: 'bar',
    data: { labels: wdNames, datasets: [{ label: '미조회율(%)', data: rates, backgroundColor: '#2e5484' }] },
    options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
  });
}

function renderMonthlyChart() {
  const months = {};
  statsCache.forEach(r => {
    const m = r.date.slice(0,7);
    if (!months[m]) months[m] = {joh:0,total:0};
    months[m].joh += r.joh; months[m].total += r.total;
  });
  const keys = Object.keys(months).sort();
  destroyChart('monthly');
  charts.monthly = new Chart(document.getElementById('chartMonthly'), {
    type: 'line',
    data: {
      labels: keys,
      datasets: [
        { label: '조회', data: keys.map(k=>months[k].joh), borderColor:'#2e9e5b', backgroundColor:'#2e9e5b', tension:.2 },
        { label: '전체', data: keys.map(k=>months[k].total), borderColor:'#1b3a5c', backgroundColor:'#1b3a5c', tension:.2 }
      ]
    },
    options: { responsive:true, scales:{ y:{ beginAtZero:true } } }
  });
}

document.getElementById('printBtn').addEventListener('click', () => window.print());

/* ---------- 3) 마스터 화면 ---------- */
let masterPw = '';

document.getElementById('masterLoginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('masterPw').value;
  const res = await callApi('masterLogin', { password: pw });
  const msg = document.getElementById('masterLoginMsg');
  if (res.ok) {
    masterPw = pw;
    document.getElementById('masterLoginBox').style.display = 'none';
    document.getElementById('masterPanel').style.display = 'block';
    loadMasterStatus();
  } else {
    msg.className = 'msg err'; msg.textContent = res.error;
  }
});

async function loadMasterStatus() {
  const res = await callApi('getTodayStatus', {});
  if (!res.ok) return;
  const grid = document.getElementById('statusGrid');
  grid.innerHTML = '';
  Object.keys(res.status).forEach(dept => {
    const s = res.status[dept];
    let cls = 'red', label = '미입력';
    if (s.am && s.pm) { cls='green'; label='완료'; }
    else if (s.am || s.pm) { cls='amber'; label = s.am ? '오전만' : '오후만'; }
    const div = document.createElement('div');
    div.className = 'status-item';
    div.innerHTML = `<span class="dot ${cls}"></span>${dept} <div style="color:#888;margin-top:3px;">${label}</div>`;
    grid.appendChild(div);
  });
}

function populateMasterDeptSelects() {
  ['unlockDept','removeDeptSelect'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '';
    departments.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    });
  });
}

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const date = document.getElementById('unlockDate').value;
  const dept = document.getElementById('unlockDept').value;
  const msg = document.getElementById('unlockMsg');
  if (!date) { msg.className='msg err'; msg.textContent='날짜를 입력하세요 (YYYY-MM-DD)'; return; }
  const res = await callApi('masterUnlock', { password: masterPw, date, dept });
  if (res.ok) { msg.className='msg ok'; msg.textContent = `잠금 해제 완료 (${res.unlockedRows}건)`; }
  else { msg.className='msg err'; msg.textContent = res.error; }
});

document.getElementById('addDeptBtn').addEventListener('click', async () => {
  const name = document.getElementById('newDeptName').value.trim();
  const msg = document.getElementById('deptMgmtMsg');
  if (!name) return;
  const res = await callApi('masterAddDept', { password: masterPw, deptName: name });
  if (res.ok) {
    msg.className='msg ok'; msg.textContent = '부서가 추가되었습니다. 새로고침 후 반영됩니다.';
    document.getElementById('newDeptName').value = '';
    await initEntryView();
  } else { msg.className='msg err'; msg.textContent = res.error; }
});

document.getElementById('removeDeptBtn').addEventListener('click', async () => {
  const name = document.getElementById('removeDeptSelect').value;
  const msg = document.getElementById('deptMgmtMsg');
  const res = await callApi('masterRemoveDept', { password: masterPw, deptName: name });
  if (res.ok) {
    msg.className='msg ok'; msg.textContent = '부서가 삭제(사용중지)되었습니다.';
    await initEntryView();
  } else { msg.className='msg err'; msg.textContent = res.error; }
});

/* ---------- 초기화 ---------- */
initEntryView();
updateTotal();
</script>
</body>
</html>
